html, body { margin: 0; height: 100%; }

input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button { width: 100%; margin-top: 12px; font: 600 15px system-ui, sans-serif; padding: 11px; border: none; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.err { color: var(--err); font-size: 13.5px; min-height: 20px; margin: 10px 0 0; }

  var P = JSON.parse(document.getElementById('p').textContent);
  var $ = function (id) { return document.getElementById(id); };
  var b64 = function (s) { return Uint8Array.from(atob(s), function (c) { return c.charCodeAt(0); }); };
  var norm = function (c) { return c.toUpperCase().replace(/[^A-Z0-9]/g, ''); };
  // registro degli accessi (un Foglio Google, se configurato): chi, cosa, da quale dispositivo
  var ua = navigator.userAgent;
  var dispositivo = (/iPhone/.test(ua) ? 'iPhone' : /iPad|Macintosh.*Mobile/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : 'Altro')
    + ' · ' + (/Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'browser');
  function registra(nome, evento) {
    if (!P.notifica) return;
    try { fetch(P.notifica, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ nome: nome, evento: evento, dispositivo: dispositivo }) }).catch(function () {}); } catch (e) {}
  }

  // copia pubblicata altrove senza permesso
  var h = location.hostname;
  if (P.siti.length && P.siti.indexOf(h) < 0 && !/^(localhost|127\.0\.0\.1|)$/.test(h)) {
    $('box').innerHTML = '<div class="brand">Copia non autorizzata</div><p>Questa versione di Treenet non è pubblicata dal suo autore. © 2026 Federico Sassaroli. Tutti i diritti riservati.</p>';
    return;
  }
  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
  if (!(window.crypto && crypto.subtle)) { $('e').textContent = 'Questo browser è troppo vecchio: aggiorna Safari, Chrome o Firefox.'; return; }

  function apri(dati, k) {
    var iv = b64(dati.iv), d = b64(dati.d);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, k, d);
  }

  async function entra(codice) {
    var btn = $('b'); btn.disabled = true; btn.textContent = 'Apro…'; $('e').textContent = '';
    try {
      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(norm(codice)), 'PBKDF2', false, ['deriveKey']);
      var kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.sale), iterations: P.iter, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      var porta = null;
      for (var i = 0; i < P.porte.length && !porta; i++) {
        try { porta = JSON.parse(new TextDecoder().decode(await apri(P.porte[i], kek))); } catch (e) { /* non è questa */ }
      }
      if (!porta) { registra('?', 'codice errato'); throw new Error('Codice non valido.'); }
      // la prova dura porta.g giorni dal primo accesso con questo codice, e mai oltre porta.s
      var fine = porta.s ? new Date(porta.s + 'T23:59:59') : null;
      if (porta.g) {
        var kInizio = 'treenet-prova-inizio-' + norm(codice), inizio = null;
        try { inizio = localStorage.getItem(kInizio); if (!inizio) { inizio = new Date().toISOString().slice(0, 10); localStorage.setItem(kInizio, inizio); } } catch (e) { inizio = new Date().toISOString().slice(0, 10); }
        var f = new Date(inizio + 'T23:59:59'); f.setDate(f.getDate() + porta.g - 1);
        if (!fine || f < fine) fine = f;
      }
      var data = function (d) { return d.toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' }); };
      if (fine && new Date() > fine) { registra(porta.n, 'prova scaduta'); throw new Error('Il periodo di prova è finito il ' + data(fine) + '. Scrivi a Federico Sassaroli per continuare.'); }
      var chiave = await crypto.subtle.importKey('raw', b64(porta.k), 'AES-GCM', false, ['decrypt']);
      var html = new TextDecoder().decode(await apri(P.programma, chiave));
      var nome = porta.n.replace(/[&<>"'\\]/g, '');
      registra(porta.n, 'accesso');
      document.open(); document.write(html.split('__TN_NOME__').join(nome).split('__TN_FINE__').join(fine ? data(fine) : 'nuovo avviso')
        .split('__TN_LOG__').join(JSON.stringify(P.notifica)).split('__TN_DISP__').join(JSON.stringify(dispositivo))); document.close();
    } catch (err) {
      btn.disabled = false; btn.textContent = 'Entra';
      $('e').textContent = err.message || '';
    }
  }

  // il codice si chiede a ogni apertura: niente accesso automatico
  $('f').addEventListener('submit', function (e) { e.preventDefault(); entra($('c').value); });
  $('c').focus();
})();
</script>
</body>
</html>

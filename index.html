* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 16px; }
.box { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px 22px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; }
.brand svg { width: 34px; height: 34px; padding: 6px; border-radius: 9px; background: var(--accent); fill: none; stroke: #fff; stroke-width: 2; stroke-linejoin: round; }
.tag { display: inline-block; margin-left: 4px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); border: 1px solid currentColor; border-radius: 99px; padding: 1px 8px; vertical-align: middle; }
p { color: var(--muted); margin: 14px 0; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
input { width: 100%; font: 600 17px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button { width: 100%; margin-top: 12px; font: 600 15px system-ui, sans-serif; padding: 11px; border: none; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.err { color: var(--err); font-size: 13.5px; min-height: 20px; margin: 10px 0 0; }
.langs { display: flex; gap: 4px; margin-left: auto; }
.langs button { width: auto; margin: 0; padding: 4px 8px; font-size: 12px; background: none; color: var(--muted); border: 1px solid var(--line); border-radius: 7px; }
.langs button.on { color: var(--accent); border-color: var(--accent); }
#u { text-transform: none; letter-spacing: 0; font-family: inherit; margin-bottom: 12px; }
.legal { font-size: 11.5px; line-height: 1.45; margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--line); }

        var f = new Date(inizio + 'T23:59:59'); f.setDate(f.getDate() + porta.g - 1);
        if (!fine || f < fine) fine = f;
      }
      var data = function (d) { return d.toLocaleDateString(t.locale, { day: 'numeric', month: 'long', year: 'numeric' }); };
      if (fine && new Date() > fine) { registra(porta.n, 'prova scaduta'); throw new Error(t.scaduta.replace('%', data(fine))); }
      var chiave = await crypto.subtle.importKey('raw', b64(porta.k), 'AES-GCM', false, ['decrypt']);
      var html = new TextDecoder().decode(await apri(P.programmi[lingua], chiave));
      var nome = porta.n.replace(/[&<>"'\\]/g, '');
      registra(porta.n, 'accesso (' + lingua.toUpperCase() + ')');
      document.open(); document.write(html.split('__TN_NOME__').join(nome).split('__TN_FINE__').join(fine ? data(fine) : t.mai)
        .split('__TN_LOG__').join(JSON.stringify(P.notifica)).split('__TN_DISP__').join(JSON.stringify(dispositivo))); document.close();
    } catch (err) {
      btn.disabled = false; btn.textContent = t.entra;
      $('e').textContent = err.message || '';
    }
  }

  // utente e codice si chiedono a ogni apertura: niente accesso automatico
  $('f').addEventListener('submit', function (e) { e.preventDefault(); entra($('u').value, $('c').value); });
  $('u').focus();
})();
</script>

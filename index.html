* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; display: grid; place-items: center; padding: 16px; }
.box { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 28px 24px 22px; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; }
.brand svg { width: 34px; height: 34px; padding: 6px; border-radius: 9px; background: var(--accent); fill: none; stroke: #fff; stroke-width: 2; stroke-linejoin: round; }
.tag { display: inline-block; margin-left: 4px; font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); border: 1px solid currentColor; border-radius: 99px; padding: 1px 8px; vertical-align: middle; }
p { color: var(--muted); margin: 14px 0; }
label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
input { width: 100%; font: 600 17px/1.2 ui-monospace, Menlo, monospace; letter-spacing: .06em; text-transform: uppercase; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
input:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
button { width: 100%; margin-top: 12px; font: 600 15px system-ui, sans-serif; padding: 11px; border: none; border-radius: 10px; background: var(--accent); color: #fff; cursor: pointer; }
button:disabled { opacity: .6; cursor: wait; }
.err { color: var(--err); font-size: 13.5px; min-height: 20px; margin: 10px 0 0; }
.langs { display: flex; gap: 4px; margin-left: auto; }
.langs button { width: auto; margin: 0; padding: 4px 8px; font-size: 12px; background: none; color: var(--muted); border: 1px solid var(--line); border-radius: 7px; }
.langs button.on { color: var(--accent); border-color: var(--accent); }
#u { text-transform: none; letter-spacing: 0; font-family: inherit; margin-bottom: 12px; }
.legal { font-size: 11.5px; line-height: 1.45; margin: 18px 0 0; padding-top: 14px; border-top: 1px solid var(--line); }

<script>

      errato: 'Usuario o código no válidos.', scaduta: 'El periodo de prueba terminó el %. Escribe a Federico Sassaroli para continuar.', vecchio: 'Este navegador es demasiado antiguo: actualiza Safari, Chrome o Firefox.', locale: 'es-ES', mai: 'nuevo aviso' },
  };
  // lingua: quella scelta l'ultima volta, altrimenti quella del browser
  var lingua;
  try { lingua = localStorage.getItem('treenet-prova-lingua'); } catch (e) {}
  if (!lingua || P.lingue.indexOf(lingua) < 0) { lingua = (navigator.language || 'it').slice(0, 2); if (P.lingue.indexOf(lingua) < 0) lingua = P.lingue.indexOf('en') >= 0 && lingua !== 'it' ? 'en' : P.lingue[0]; }
  function mostraLingua(l) {
    lingua = l; var t = TXT[l];
    try { localStorage.setItem('treenet-prova-lingua', l); } catch (e) {}
    document.documentElement.lang = l;
    [].forEach.call(document.querySelectorAll('[data-t]'), function (el) { el.textContent = t[el.dataset.t]; });
    [].forEach.call(document.querySelectorAll('[data-l]'), function (b) { b.classList.toggle('on', b.dataset.l === l); b.hidden = P.lingue.indexOf(b.dataset.l) < 0; });
    $('e').textContent = '';

  $('langs').addEventListener('click', function (e) { var b = e.target.closest('[data-l]'); if (b) mostraLingua(b.dataset.l); });
  mostraLingua(lingua);
  // registro degli accessi (un Foglio Google, se configurato): chi, cosa, da quale dispositivo
  var ua = navigator.userAgent;
  var dispositivo = (/iPhone/.test(ua) ? 'iPhone' : /iPad|Macintosh.*Mobile/.test(ua) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Mac/.test(ua) ? 'Mac' : /Windows/.test(ua) ? 'Windows' : 'Altro')
    + ' · ' + (/Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'browser');
  function registra(nome, evento) {
    if (!P.notifica) return;
    try { fetch(P.notifica, { method: 'POST', mode: 'no-cors', keepalive: true, headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify({ nome: nome, evento: evento, dispositivo: dispositivo }) }).catch(function () {}); } catch (e) {}
  }

  // copia pubblicata altrove senza permesso
  var h = location.hostname;
  if (P.siti.length && P.siti.indexOf(h) < 0 && !/^(localhost|127\.0\.0\.1|)$/.test(h)) {

  if (!(window.crypto && crypto.subtle)) { $('e').textContent = TXT[lingua].vecchio; return; }

  function apri(dati, k) {
    var iv = b64(dati.iv), d = b64(dati.d);
    return crypto.subtle.decrypt({ name: 'AES-GCM', iv: iv }, k, d);
  }

  async function entra(utente, codice) {
    var t = TXT[lingua], btn = $('b'); btn.disabled = true; btn.textContent = t.apro; $('e').textContent = '';

      var base = await crypto.subtle.importKey('raw', new TextEncoder().encode(normUtente(utente) + ':' + norm(codice)), 'PBKDF2', false, ['deriveKey']);

      var porta = null;
      for (var i = 0; i < P.porte.length && !porta; i++) {

      var html = new TextDecoder().decode(await apri(P.programmi[lingua], chiave));
      var nome = porta.n.replace(/[&<>"'\\]/g, '');
      registra(porta.n, 'accesso (' + lingua.toUpperCase() + ')');
      document.open(); document.write(html.split('__TN_NOME__').join(nome).split('__TN_FINE__').join(fine ? data(fine) : t.mai)
